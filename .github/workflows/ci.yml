name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# What a push to main MEANS here, decided in #801.
#
# It is a GATE, not a post-hoc signal. Production must not reach a family
# until the checks on that commit are green.
#
# That was a real choice with a real alternative. Vercel promotes production
# about 55 seconds after a push and is gated on no workflow, so before this
# decision anything these jobs found was found after it had shipped, and the
# red run that said so was read by nobody. The alternative was to keep that and
# record it as intended, on the grounds that the pull request already ran both
# gates on a tree byte for byte identical to the merged one.
#
# The gate itself is #817: Vercel builds a STAGED production deployment on
# push, serving nobody, and a workflow promotes it once these jobs pass.
# Until #817 lands, these runs are still post-hoc, so do not read a green tick
# here as proof that what is live was tested.
#
# The reason this is affordable is #812: on the normal path these jobs are
# satisfied in about 30 seconds by proving the merged tree is the tree the
# pull request already tested, and only an unproven merge pays the full 8 to
# 12 minutes. So do not optimise these runs on the assumption that nothing
# waits for them, and do not make the proof looser to make them faster: it
# fails closed on purpose.

# The merged tree proof (#812) asks GitHub three questions on a push to main:
# which pull request carries this commit, what tree its head had, and whether
# the required check was green there. The default workflow token could answer
# none of them: the first main run after #812 merged reported
#
#   GitHub API 403 Forbidden for /commits/<sha>/pulls:
#   "Resource not accessible by integration"
#
# so the proof had never once held, and never could have. It failed closed and
# ran the full suite, which is right, but the saving was silently absent.
#
# Declared here rather than left to the repository default, and listed rather
# than granted wholesale: an over-broad permission is invisible, because the
# code never attempts what it is not meant to do, while a missing one fails
# loudly on the first run, which is exactly what happened here (L503).
permissions:
  contents: read       # checkout, and reading a commit's tree
  pull-requests: read  # which pull request carries the pushed commit
  checks: read         # whether that pull request's required check was green

# Cancelling superseded runs is right on a branch, where only the latest commit
# matters. On main it destroys the only report there will ever be: the full
# guard mutation sweep runs ONLY on a push, so a second merge inside its 6.5
# minute window used to cancel the first merge's sweep, and a mutant that
# survived on that commit was then reported nowhere at all (#807, L98).
#
# Since #801 it is worse than losing a report: production waits for this job
# (#817), so a cancelled run leaves a merge that never goes live.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The guard mutation step diffs this branch against its base to work
          # out which guards it has to re-prove, which needs real history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # On a push to main, ask whether this exact tree has already been through
      # this suite on the pull request it came from (#812). The `Protect main`
      # ruleset requires linear history and an up-to-date branch and merges are
      # squashes, so the merged commit's tree IS the pull request head's tree:
      # identical on all six merges checked (#789 to #794).
      #
      # Since #801 the production promotion waits for this job (#817), so this
      # is not a saving bolted onto a pointless run: it is what lets the gate be
      # real without making every deploy wait 8 to 12 minutes. It fails closed.
      # A direct push, a tree that does not match, a check that was not green,
      # or a lookup that fell over all run the suite in full.
      # continue-on-error on both proof steps: the proof is an optimisation, and
      # an optimisation that can fail the job is worse than no optimisation. A
      # failed tsx install or a failed lookup leaves `proven` empty, which reads
      # as "not proven" and runs everything, which is exactly right. The step
      # summary still says a lookup failed, so this is not silent (L289).
      - name: Install tsx
        if: github.event_name == 'push'
        continue-on-error: true
        uses: ./.github/actions/setup-tsx

      - name: Check the merged tree proof
        id: proof
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_CHECK: "lint, typecheck, test"
        run: tsx scripts/check-merged-tree-proof.ts

      # Vitest's results store, which orders test files slowest first, lives in
      # .vitest-cache outside node_modules so it survives `npm ci` (#811).
      #
      # Only that store: measured, vitest writes one 24KB results.json here and
      # no transform cache at all, despite what the issue asked for and what an
      # earlier version of this comment said.
      #
      # Worth about 12 to 17 seconds on the vitest step, measured over six runs
      # on one unchanged tree alternating a deleted and a restored cache:
      # 112, 112, 114 seconds cold against 96, 110, 95 warm.
      #
      # Keyed on the lockfile and the vitest config, because either can change
      # which files run and how long they take, which is what the ordering is
      # about. Restored on a partial key too: a stale ordering is still a
      # better guess than none, and vitest rebuilds the store as it goes.
      - name: Cache the vitest results store
        uses: actions/cache@v4
        with:
          path: .vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vitest.config.ts') }}
          restore-keys: |
            vitest-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: steps.proof.outputs.proven != 'true'
        run: npm run lint

      # #847. `local/require-db-error-check` ships at `warn`, because 283 sites
      # already break it, and a warning nothing counts is a warning nobody
      # reads. This holds the per-file count where it is and fails when it
      # rises, so the sweep in milestone 35 cannot be outrun by new instances
      # of the class it removes. #992 flips the rule to `error` and this check
      # retires with it. About 4 seconds; it lints the tree itself rather than
      # reading the step above, because the number has to be the tree's.
      - name: Check the discarded-database-error ratchet
        if: steps.proof.outputs.proven != 'true'
        run: npx tsx scripts/db-error-ratchet.ts

      - name: Typecheck
        if: steps.proof.outputs.proven != 'true'
        # npm run typecheck = `next typegen && tsc --noEmit`. typegen regenerates
        # route types so this also catches route-type errors that previously only
        # surfaced in `next build`.
        run: npm run typecheck

      - name: Run tests
        if: steps.proof.outputs.proven != 'true'
        run: npm test

      # A tool only honours a directory setting if it actually writes there
      # (L322, #811). This cannot be a unit test: vitest writes its results
      # store when the run ENDS, so a test inside that run can only ever read
      # the previous one's artefact, and would pass or fail on ambient state.
      #
      # Checked here, after the suite, where the answer is about this run. If
      # vitest ever stops honouring cacheDir the cache silently caches nothing
      # and CI just gets slower, with everything still green (L289).
      - name: Check vitest used its cache directory
        if: steps.proof.outputs.proven != 'true'
        run: |
          set -euo pipefail
          if [ ! -d .vitest-cache ] || [ -z "$(ls -A .vitest-cache)" ]; then
            echo "vitest wrote nothing to .vitest-cache, so cacheDir is not" \
                 "being honoured and the cache step above is preserving an" \
                 "empty directory."
            exit 1
          fi
          echo "vitest cache: $(du -sh .vitest-cache | cut -f1)"

      # #642. `npm test` proves every guarded surface HAS a test. It cannot prove
      # the test would FAIL if the guard were deleted, and every gap closed in
      # #617, #629, #618, #633 and #634 was a passing test that could not fail.
      # This deletes each guard for real and requires the suite to notice.
      #
      # It lives in this job, rather than a workflow of its own, because this is
      # the check main's ruleset actually requires: a separate workflow would run
      # on a pull request and still let it merge red.
      #
      # On a pull request it re-proves only the guards that branch could have
      # broken (a changed guard, or a changed boundary suite), so a branch that
      # touches neither pays nothing. On merge to main it sweeps all of them.
      - name: Prove guard tests can fail (pull request)
        if: github.event_name == 'pull_request'
        run: npx tsx scripts/guard-mutation.ts --since=origin/${{ github.base_ref }}

      - name: Prove guard tests can fail (full sweep)
        if: github.event_name == 'push'
        run: npx tsx scripts/guard-mutation.ts
