name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The merged tree proof (#812) asks GitHub three questions on a push to main:
# which pull request carries this commit, what tree its head had, and whether
# the required check was green there. The default workflow token could answer
# none of them: the first main run after #812 merged reported
#
#   GitHub API 403 Forbidden for /commits/<sha>/pulls:
#   "Resource not accessible by integration"
#
# so the proof had never once held, and never could have. It failed closed and
# ran the full suite, which is right, but the saving was silently absent.
#
# Declared here rather than left to the repository default, and listed rather
# than granted wholesale: an over-broad permission is invisible, because the
# code never attempts what it is not meant to do, while a missing one fails
# loudly on the first run, which is exactly what happened here (L503).
permissions:
  contents: read       # checkout, and reading a commit's tree
  pull-requests: read  # which pull request carries the pushed commit
  checks: read         # whether that pull request's required check was green

# Cancelling superseded runs is right on a branch, where only the latest commit
# matters. On main it destroys the only report there will ever be: the full
# guard mutation sweep runs ONLY on a push, so a second merge inside its 6.5
# minute window used to cancel the first merge's sweep, and a mutant that
# survived on that commit was then reported nowhere at all (#807, L98).
#
# Since #801 it is worse than losing a report: production waits for this job
# (#817), so a cancelled run leaves a merge that never goes live.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The guard mutation step diffs this branch against its base to work
          # out which guards it has to re-prove, which needs real history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # On a push to main, ask whether this exact tree has already been through
      # this suite on the pull request it came from (#812). The `Protect main`
      # ruleset requires linear history and an up-to-date branch and merges are
      # squashes, so the merged commit's tree IS the pull request head's tree:
      # identical on all six merges checked (#789 to #794).
      #
      # Since #801 the production promotion waits for this job (#817), so this
      # is not a saving bolted onto a pointless run: it is what lets the gate be
      # real without making every deploy wait 8 to 12 minutes. It fails closed.
      # A direct push, a tree that does not match, a check that was not green,
      # or a lookup that fell over all run the suite in full.
      # continue-on-error on both proof steps: the proof is an optimisation, and
      # an optimisation that can fail the job is worse than no optimisation. A
      # failed tsx install or a failed lookup leaves `proven` empty, which reads
      # as "not proven" and runs everything, which is exactly right. The step
      # summary still says a lookup failed, so this is not silent (L289).
      - name: Install tsx
        if: github.event_name == 'push'
        continue-on-error: true
        uses: ./.github/actions/setup-tsx

      - name: Check the merged tree proof
        id: proof
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_CHECK: "lint, typecheck, test"
        run: tsx scripts/check-merged-tree-proof.ts

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: steps.proof.outputs.proven != 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.proof.outputs.proven != 'true'
        # npm run typecheck = `next typegen && tsc --noEmit`. typegen regenerates
        # route types so this also catches route-type errors that previously only
        # surfaced in `next build`.
        run: npm run typecheck

      - name: Run tests
        if: steps.proof.outputs.proven != 'true'
        run: npm test

      # #642. `npm test` proves every guarded surface HAS a test. It cannot prove
      # the test would FAIL if the guard were deleted, and every gap closed in
      # #617, #629, #618, #633 and #634 was a passing test that could not fail.
      # This deletes each guard for real and requires the suite to notice.
      #
      # It lives in this job, rather than a workflow of its own, because this is
      # the check main's ruleset actually requires: a separate workflow would run
      # on a pull request and still let it merge red.
      #
      # On a pull request it re-proves only the guards that branch could have
      # broken (a changed guard, or a changed boundary suite), so a branch that
      # touches neither pays nothing. On merge to main it sweeps all of them.
      - name: Prove guard tests can fail (pull request)
        if: github.event_name == 'pull_request'
        run: npx tsx scripts/guard-mutation.ts --since=origin/${{ github.base_ref }}

      - name: Prove guard tests can fail (full sweep)
        if: github.event_name == 'push'
        run: npx tsx scripts/guard-mutation.ts
