name: Job Watchdog

# Everything in this repo that runs on a schedule alerts when it FAILS. Until
# this job existed, nothing noticed when one stopped running at all, and from
# outside those two are the same thing: silence (#837, #757, L13).
#
# Two sets of jobs, one question. GitHub's scheduled workflows are judged on
# when each last completed successfully on its own schedule. Vercel's thirteen
# crons are judged on the heartbeat each one writes when it gets through, read
# back over HTTP. The Vercel half lives here, and not in a fourteenth cron,
# because a check that runs on the same scheduler as the jobs it watches dies
# with them.
#
# GitHub disables a scheduled workflow after 60 days without repository
# activity, and says so only in an email to the repository owner. A counter
# that has quietly stopped counting is exactly the failure CI Health exists to
# catch, turned on itself.
#
# It reads each workflow's own cron expression and judges that workflow against
# it, so a weekly job is allowed a week and a daily one is not. Nothing here is
# a hand-kept list: a scheduled workflow added later is watched without anybody
# remembering to add it.
#
# THE GAP THIS CANNOT CLOSE, stated rather than left to be discovered: it
# cannot report its own absence. If GitHub disables THIS schedule, nothing
# says so, and the only remaining signals are GitHub's own email to the owner
# and the fact that the daily "all healthy" line stops appearing in the run
# log. Watching the watcher from inside the same account is not possible
# without a second, independent system.
#
# ITS OWN ENTRY IS MEASURED DIFFERENTLY, and has to be. Every other job here is
# judged on when it last SUCCEEDED. Judging this one that way latches it: the
# first time it correctly reports some other job it exits 1, its own success
# clock stops, and the next run finds ITSELF overdue, fails for that reason,
# and pushes its own clock a further day out, forever, long after the original
# problem is fixed. That is not hypothetical. Third Party Health failed on
# 2026-09-03, this correctly reported it on the 4th, it recovered hours later,
# and from the 5th every run of this reported nothing but itself.
#
# So its own entry is judged on whether its SCHEDULE STILL FIRES, not on
# whether the run passed. A run of it that fired and failed is already alerting
# through its own red run; being dispatched at all is the only thing about
# itself that nothing else would say. The relaxation is scoped to that one
# entry and to nothing else (L324).

on:
  # Daily, and deliberately not weekly: the jobs it watches include daily ones,
  # and a watcher slower than the thing it watches turns every real outage into
  # a week of silence.
  #
  # This schedule is now the BACKSTOP rather than the main trigger (#967).
  # GitHub dispatches every scheduled workflow here hours after its declared
  # time, and not by the same amount: measured over the last 100 scheduled runs
  # of each on 2026-09-04, this one landed at ~11:20 UTC while the checks it
  # watches landed at ~15:38 to ~17:07. So on any given day it was judging the
  # PREVIOUS day's runs, and a job that failed today could not be reported
  # until tomorrow. Third Party Health failed at 15:37 on 2026-09-03 and the
  # earliest this could speak was 11:22 the next day, 20 hours later.
  #
  # Declaring a later cron would not fix it, because the declared time is not
  # what GitHub honours, and ordering two jobs by arithmetic between their
  # crons is exactly what went wrong (L386).
  schedule:
    - cron: "20 6 * * *"

  # The real ordering. Production Smoke is the last of the daily checks to be
  # dispatched, so its completion is the moment all of today's runs have
  # happened. Chaining on it makes "after the checks" a dependency rather than
  # an assumption, and halves the worst case detection delay: a failure today
  # is reported today.
  #
  # The cron above stays, and is not redundant. If Production Smoke's own
  # schedule is disabled, nothing would ever fire this chain again, and a
  # watchdog that goes silent because the thing it watches went silent is the
  # exact failure it exists to report (L98).
  workflow_run:
    workflows: ["Production Smoke"]
    # Completed, not success: a failed check is precisely when this reading
    # matters, so waiting for a green run would go quiet at the worst moment.
    types: [completed]

  workflow_dispatch:

# Read-only, listed rather than granted wholesale: an over-broad permission is
# invisible, because the code never attempts what it is not meant to do, while
# a missing one fails loudly on the first run (L503).
permissions:
  contents: read # checkout
  actions: read # listing each workflow's runs

concurrency:
  group: job-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: Check every scheduled job still runs
    # Production Smoke also runs on every push to main. Without this the
    # watchdog would run on every merge, and a job that is genuinely overdue
    # would be announced to Slack once per merge until somebody fixed it, which
    # is how an alert stops being read (L36). Only its SCHEDULED runs mean "the
    # day's checks have now happened".
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    # A handful of small API calls, one or two per scheduled workflow. Five
    # minutes is far more than it needs and far less than the six hour default,
    # which would let a hung request hold a runner and bill 360 minutes
    # (#809, L110).
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install tsx
        uses: ./.github/actions/setup-tsx

      # What was already announced, so an unchanged finding is not sent to
      # Slack on every reading (#1078). This runs about twice a day: its own
      # cron above, and the completion of Production Smoke's SCHEDULED run,
      # the push triggered ones being excluded by the job condition above.
      # An overdue finding stays true until the watched job's next scheduled
      # run succeeds, which for a weekly job is up to six days, so roughly a
      # dozen identical messages for one finding nobody can clear any sooner.
      #
      # restore and save are used SEPARATELY, rather than actions/cache, for
      # one reason: this job exits non zero whenever there is a finding, which
      # is exactly when there is something to remember. Relying on a combined
      # action's own save-on-success behaviour would mean the record was only
      # ever written on runs that found nothing, so the suppression would never
      # once take effect while every test of it passed.
      #
      # A cache key is immutable, so each run writes its own and the prefix
      # restores the newest. A miss restores nothing, which reads as "nothing
      # has been said" and sends the alert: losing this costs one duplicate
      # message and never a silence.
      - name: Restore what has already been announced
        uses: actions/cache/restore@v4
        with:
          path: .watchdog-announced.json
          key: watchdog-announced-${{ github.run_id }}
          restore-keys: |
            watchdog-announced-

      # SLACK_BOT_TOKEN is optional and follows Production Smoke: without it the
      # failing job is the only signal, and the checker says so in the log
      # rather than skipping in silence.
      - name: Report any job that has stopped running
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Reads the cron heartbeats. Its own secret rather than CRON_SECRET,
          # which could trigger every cron, or ADMIN_SECRET, which reaches every
          # admin route: this reader needs to do nothing but read timestamps.
          HEARTBEAT_READ_SECRET: ${{ secrets.HEARTBEAT_READ_SECRET }}
        run: tsx scripts/check-scheduled-jobs.ts

      # always(), because the step above exits 1 on a finding and that is the
      # run whose record matters. Without this the file would be saved only
      # after a clean run, which has nothing to remember.
      - name: Save what has been announced
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .watchdog-announced.json
          key: watchdog-announced-${{ github.run_id }}
