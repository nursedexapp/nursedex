name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: authenticated e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # On a push to main, ask whether this exact tree has already been through
      # this suite on the pull request it came from (#812). The `Protect main`
      # ruleset requires linear history and an up-to-date branch and merges are
      # squashes, so the merged commit's tree IS the pull request head's tree:
      # identical on all six merges checked (#789 to #794).
      #
      # Since #801 the production promotion waits for this job (#817), so this
      # is not a saving bolted onto a pointless run: it is what lets the gate be
      # real without making every deploy wait 8 to 12 minutes. It fails closed.
      # A direct push, a tree that does not match, a check that was not green,
      # or a lookup that fell over all run the suite in full.
      # continue-on-error on both proof steps: the proof is an optimisation, and
      # an optimisation that can fail the job is worse than no optimisation. A
      # failed tsx install or a failed lookup leaves `proven` empty, which reads
      # as "not proven" and runs everything, which is exactly right. The step
      # summary still says a lookup failed, so this is not silent (L289).
      - name: Install tsx
        if: github.event_name == 'push'
        continue-on-error: true
        uses: ./.github/actions/setup-tsx

      - name: Check the merged tree proof
        id: proof
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_CHECK: authenticated e2e
        run: tsx scripts/check-merged-tree-proof.ts

      - name: Install dependencies
        if: steps.proof.outputs.proven != 'true'
        run: npm ci

      # Migration 042 adds explicit Data API GRANTs for anon/authenticated/
      # service_role, so we track the latest CLI again. (v2.106.0 stopped
      # auto-exposing public tables, which broke every query with "permission
      # denied" until those grants landed. See issue #354.)
      - name: Setup Supabase CLI
        if: steps.proof.outputs.proven != 'true'
        uses: supabase/setup-cli@v2
        with:
          version: latest
          # Resolving "latest" hits the GitHub API; without a token it uses the
          # unauthenticated 60/hr limit and intermittently fails with "rate
          # limit exceeded". The default workflow token raises that ceiling.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A throwaway local Supabase (Docker) so the run needs no secrets and
      # never touches a real database.
      #
      # This used to be followed by `supabase db reset`, which applied the
      # identical migrations and seed a second time, 32 to 38 seconds per run
      # (#803). The comment here credited reset with surfacing a broken
      # migration, so that was measured rather than assumed before dropping it:
      # a branch with a migration that cannot apply (#821) made THIS step fail,
      # naming the migration and the SQL error, and reset never ran at all.
      # A successful run's log shows this step applying 001 through 065 and
      # `Seeding data from supabase/seed.sql`, so nothing else was lost either.
      # Seven of the twelve images `supabase start` pulls are for services
      # nothing in the suite reaches (#802): no edge functions exist in the
      # repo, nothing subscribes to Realtime, the e2e setups create users
      # through the admin API with email_confirm true, and nobody opens Studio
      # on a runner. Storage stays, for nurse photos and blog images.
      #
      # The names are checked against the CLI's OWN list before use, because
      # --exclude is a cobra string slice and silently ignores a name it does
      # not know. A typo, or a service renamed in a later CLI (this job tracks
      # `latest`), would otherwise exclude nothing, cost the same 115 seconds,
      # and look exactly like this working.
      #
      # A spec that needed an excluded service fails on connection refused, so
      # the exclusion list is proved by the run itself.
      - name: Start Supabase
        if: steps.proof.outputs.proven != 'true'
        env:
          EXCLUDED_SERVICES: >-
            studio logflare vector edge-runtime realtime mailpit postgres-meta
        run: |
          set -euo pipefail
          exclude=$(supabase start --help 2>&1 | npx tsx scripts/check-supabase-exclusions.ts)
          echo "Excluding: $exclude"
          supabase start -x "$exclude"

      # Map the local stack's URL/keys onto the names the app reads. The
      # anon key doubles as the publishable key for supabase-js locally.
      # `-o env` quotes values (KEY="val"); eval into the shell to strip the
      # quotes, then write clean values to GITHUB_ENV (which keeps quotes
      # literal and would otherwise produce an "Invalid supabaseUrl").
      - name: Export Supabase env for the app
        if: steps.proof.outputs.proven != 'true'
        run: |
          eval "$(supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SECRET_KEY)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      # RLS regression guards: anon-role read/write checks (rls-policies)
      # plus the write-policy hardening checks for issues #384-389 (self-
      # escalation, paywall bypass). Only needs the local Supabase already
      # started above; runs fast, so it fails before the slower Playwright
      # suite boots.
      - name: Run RLS regression tests
        if: steps.proof.outputs.proven != 'true'
        run: npm run test:rls

      # The browser download is 23 to 41 seconds on every run (#804). Cache it
      # on the exact @playwright/test version from the lockfile, read rather
      # than written here so a version bump changes the key and re-downloads
      # instead of running new Playwright against an old browser (L41).
      - name: Resolve the Playwright version
        id: playwright
        if: steps.proof.outputs.proven != 'true'
        run: |
          set -euo pipefail
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser download
        if: steps.proof.outputs.proven != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Still runs on a cache hit, and must: --with-deps installs system
      # packages that live outside the cached directory. It costs a few seconds
      # and skips the download when the browser is already there.
      - name: Install Playwright browsers
        if: steps.proof.outputs.proven != 'true'
        run: npx playwright install --with-deps chromium

      # test:e2e:auth sets E2E_AUTH=1, which adds the setup + authenticated
      # projects. Playwright boots `npm run dev` itself (reuseExistingServer is
      # off in CI).
      - name: Run authenticated e2e
        if: steps.proof.outputs.proven != 'true'
        run: npm run test:e2e:auth

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.proof.outputs.proven != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
