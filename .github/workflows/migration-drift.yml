name: Migration Drift

# Merging a PR with a new migration does not deploy it. Migration 043, which
# blocked a user from promoting themselves to super-admin, sat merged but
# unapplied in production until it was found by accident (#518). Nothing
# signalled the gap.
#
# This job compares the migrations committed to git against those actually
# applied to production, and fails loudly when they diverge. It is read-only
# by design: it never runs `db push`. Applying migrations stays a deliberate
# human step (the gated auto-push is tracked separately in #542).

on:
  # Right after a merge, when a migration is most likely to have been
  # forgotten. Runs on every push to main, not only migration-touching ones,
  # so drift introduced elsewhere is still caught.
  push:
    branches: [main]
  # A daily backstop: drift can appear without any push, for example when a
  # migration is applied by hand or a push silently fails.
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: migration-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Check production migration drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # This job runs one TypeScript checker and nothing else. Its imports are
      # its own siblings plus src/lib/slack/constants.ts, so tsx is the entire
      # dependency tree it needs; `npm ci` rebuilt all of node_modules for it,
      # 22 to 38 seconds, and pushed Production Smoke just over the billed
      # minute on every one of its 48 monthly runs (#808).
      #
      # `--prefix` is load-bearing, not tidiness. `npm install tsx@x` run inside
      # the repo installs the named package AND everything in package.json:
      # measured at 1171 packages and 14 seconds, which is no saving at all.
      # Installing into a directory outside the repo has no package.json to
      # read, so it fetches tsx and its four dependencies and nothing else.
      #
      # The version is READ from the lockfile, never written here, so a
      # dependabot bump cannot leave this job on a different tsx than the repo.
      # `node -p` throws when the lockfile has no tsx entry, and pipefail turns
      # that into a failed step rather than an unpinned `tsx@` meaning latest.
      - name: Install tsx
        run: |
          set -euo pipefail
          version=$(node -p "require('./package-lock.json').packages['node_modules/tsx'].version")
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/tsx" "tsx@$version"
          echo "$RUNNER_TEMP/tsx/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          # Resolving "latest" hits the GitHub API; without a token it uses the
          # unauthenticated 60/hr limit and intermittently fails.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Read-only: lists what production has applied. No schema is changed.
      # A missing secret makes the CLI fail, which fails the job, rather than
      # silently reporting "in sync".
      - name: Compare local migrations against production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF"
          supabase migration list --linked --output-format json \
            | tsx scripts/check-migration-drift.ts
